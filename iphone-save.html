<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050b">
  <title>宙嵐ルナ｜動画をiPhoneに保存</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#10243c 0,#02050b 46%,#000 100%);
      color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    main{width:min(100%,520px);margin:auto;padding:22px 18px 42px;text-align:center}
    h1{font-size:25px;margin:6px 0 8px} p{color:#bed2e8;line-height:1.65;margin:8px 0 18px}
    video{display:block;width:100%;max-height:67vh;background:#000;border:1px solid #24557d;
      border-radius:18px;box-shadow:0 0 36px #1671b955}
    button,a.download{display:block;width:100%;margin:16px 0 0;padding:17px;border:0;border-radius:14px;
      font-weight:800;font-size:18px;text-decoration:none}
    button{color:#00111e;background:linear-gradient(135deg,#fff,#74d8ff)}
    a.download{color:#fff;background:#142333;border:1px solid #376a94}
    .steps{margin-top:22px;padding:16px;text-align:left;background:#09111ddd;border:1px solid #1d3955;
      border-radius:14px;color:#dbeaff;line-height:1.75}
    small{display:block;margin-top:15px;color:#7f9bb5}
  </style>
</head>
<body>
<main>
  <h1>映画予告動画を保存</h1>
  <p>下のボタンを押すと、iPhoneの共有画面が開きます。</p>
  <video controls playsinline preload="metadata" poster="trailer_launch.png">
    <source src="sorarashi_luna_movie_trailer_12s.mp4" type="video/mp4">
  </video>
  <button id="share">iPhoneに保存・Instagramへ送る</button>
  <a class="download" href="sorarashi_luna_movie_trailer_12s.mp4" download>動画ファイルをダウンロード</a>
  <div class="steps">
    <b>写真アプリへ保存する方法</b><br>
    1. 上の青いボタンを押す<br>
    2. 共有画面で「ビデオを保存」を選ぶ<br>
    3. Instagramのストーリーズから選ぶ
  </div>
  <small>宙嵐ルナ｜note・X・SPBX</small>
</main>
<script>
const button=document.getElementById("share");
button.addEventListener("click",async()=>{
  const old=button.textContent;
  try{
    button.textContent="動画を準備中…";
    button.disabled=true;
    const response=await fetch("sorarashi_luna_movie_trailer_12s.mp4");
    const blob=await response.blob();
    const file=new File([blob],"sorarashi_luna_movie_trailer.mp4",{type:"video/mp4"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"宙嵐ルナ 映画予告"});
    }else{
      location.href="sorarashi_luna_movie_trailer_12s.mp4";
    }
  }catch(e){
    if(e.name!=="AbortError") location.href="sorarashi_luna_movie_trailer_12s.mp4";
  }finally{
    button.textContent=old;
    button.disabled=false;
  }
});
</script>
</body>
</html>
